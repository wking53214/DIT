name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # DIT declares no runtime dependencies and needs no services, so
        # the matrix is the supported interpreter range and nothing else.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Run the historical test vectors
        run: python -m dit --fast

      - name: Run the quarantined v13.0 baseline
        # It must still execute: tests/test_audit_findings.py reproduces
        # the historical defects against it.
        run: python legacy/gsa_v13_citadel_processor.py

      - name: Run the quarantined DPR runtime
        # Same contract: tests/test_dpr_runtime.py pins its behaviour, so it
        # has to keep executing as found.
        run: python legacy/dpr_runtime.py
