[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "dit"
version = "13.1.0"
description = "Deterministic Integrity Tower: a gated, signed, ledger-sealed mediation proxy for probabilistic generators"
requires-python = ">=3.11"
dependencies = []
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
# Optional: lets DIT's verdicts be expressed as CNS gate results. DIT imports
# nothing from CNS unless dit.cns_connector is used. Pinned to tag v1.4.0.
cns = [
    "cns @ git+https://github.com/wking53214/cns.git@3b465dbcc1a6a4ab6f1040f93d44483196abd737",
]

[project.scripts]
dit = "dit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "legacy", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
